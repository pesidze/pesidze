<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Pesidze</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.contact-head {
  padding: 120px 28px 60px;
  border-bottom: 1px solid var(--ink);
}
.contact-head .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; display: block; }
.contact-head h1 { font-family: var(--display); font-size: clamp(80px, 16vw, 280px); line-height: 0.82; letter-spacing: -0.04em; text-transform: uppercase; }
.contact-head p { font-size: 18px; max-width: 50ch; margin-top: 24px; }

.channels {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--ink);
}
.channels > a {
  padding: 48px 28px;
  border-right: 1px solid var(--ink);
  display: flex; flex-direction: column; justify-content: space-between;
  min-height: 280px;
  transition: background .2s, color .2s;
  position: relative;
}
.channels > a:last-child { border-right: 0; }
.channels > a:hover { background: var(--ink); color: var(--paper); }
.channels .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.channels > a:hover .lbl { color: rgba(244,241,234,0.6); }
.channels .val { font-family: var(--display); font-size: clamp(20px, 2.4vw, 32px); line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase; }
.channels .arrow { font-family: var(--mono); font-size: 18px; align-self: end; }

.note-strip {
  padding: 48px 28px;
  border-bottom: 1px solid var(--ink);
  background: var(--paper-2);
}
.note-strip p {
  font-family: "Instrument Serif", serif;
  font-size: clamp(24px, 3vw, 36px);
  line-height: 1.2;
  max-width: 62ch;
  font-style: italic;
}

.form-section {
  display: grid; grid-template-columns: 1fr 2fr;
  gap: 60px;
  padding: 80px 28px;
  border-bottom: 1px solid var(--ink);
}
.form-section h2 { font-family: var(--display); font-size: clamp(40px, 6vw, 80px); line-height: 0.9; letter-spacing: -0.03em; text-transform: uppercase; }

form.pesidze {
  display: flex; flex-direction: column; gap: 0;
}
form.pesidze .field {
  border-top: 1px solid var(--ink);
  padding: 18px 0;
  display: grid; grid-template-columns: 200px 1fr;
  gap: 28px; align-items: start;
}
form.pesidze .field:last-of-type { border-bottom: 1px solid var(--ink); }
form.pesidze label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding-top: 8px; }
form.pesidze input, form.pesidze textarea, form.pesidze select {
  width: 100%; border: 0; background: transparent;
  font-family: var(--display); font-size: clamp(20px, 2.4vw, 32px);
  letter-spacing: -0.02em; text-transform: uppercase;
  outline: none; color: var(--ink);
  padding: 4px 0;
}
form.pesidze input::placeholder, form.pesidze textarea::placeholder { color: var(--muted); }
form.pesidze textarea { resize: vertical; min-height: 80px; line-height: 1.05; }
form.pesidze .radio-group { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
form.pesidze .radio-group label {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--body); font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--ink);
  padding: 0; cursor: none;
}
form.pesidze .radio-group input[type=radio] {
  appearance: none; -webkit-appearance: none;
  width: 16px; height: 16px; border: 1px solid var(--ink); background: var(--paper);
  margin: 0; flex-shrink: 0;
}
form.pesidze .radio-group input[type=radio]:checked { background: var(--ink); }
form.pesidze .submit-row { padding-top: 24px; }
form.pesidze button[type=submit] {
  display: inline-flex; align-items: center; gap: 12px;
  border: 1px solid var(--ink); padding: 18px 28px;
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
  background: var(--ink); color: var(--paper);
}
form.pesidze button[type=submit]:hover { background: transparent; color: var(--ink); }
form.pesidze .sent {
  padding: 24px 0; font-family: var(--mono); font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;
  border-top: 1px solid var(--ink);
}

@media (max-width: 800px) {
  .channels { grid-template-columns: 1fr 1fr; }
  .channels > a:nth-child(2) { border-right: 0; }
  .channels > a:nth-child(1), .channels > a:nth-child(2) { border-bottom: 1px solid var(--ink); }
  .form-section { grid-template-columns: 1fr; }
  form.pesidze .field { grid-template-columns: 1fr; gap: 8px; }
}
</style>
</head>
<body data-page="contact">

<nav class="nav"></nav>

<section class="contact-head" data-screen-label="Contact hero">
  <span class="kicker" data-i18n="contact.kicker"></span>
  <h1 data-i18n="contact.title"></h1>
  <p data-i18n="contact.lead"></p>
</section>

<div class="channels">
  <a href="mailto:hi@pesidze.studio" data-cursor="email">
    <span class="lbl" data-i18n="contact.email"></span>
    <div>
      <div class="val">hi@<br/>pesidze<br/>.studio</div>
    </div>
    <span class="arrow">↗</span>
  </a>
  <a href="https://wa.me/34600000000" data-cursor="whatsapp">
    <span class="lbl" data-i18n="contact.whatsapp"></span>
    <div class="val">+34 600<br/>000 000</div>
    <span class="arrow">↗</span>
  </a>
  <a href="tel:+34600000000" data-cursor="call">
    <span class="lbl" data-i18n="contact.phone"></span>
    <div class="val">+34 600<br/>000 000</div>
    <span class="arrow">↗</span>
  </a>
  <a href="#" data-cursor="book a call">
    <span class="lbl" data-i18n="contact.calendly"></span>
    <div>
      <div class="val">20-min<br/>chat ↗</div>
      <p style="font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; margin-top:12px; color:var(--muted);" data-i18n="contact.calendlyDesc"></p>
    </div>
    <span class="arrow">↗</span>
  </a>
</div>

<div class="note-strip">
  <p data-i18n="contact.note"></p>
</div>

<section class="form-section">
  <h2 data-i18n="contact.form.title"></h2>
  <form class="pesidze" id="contactForm">
    <div class="field">
      <label data-i18n="contact.form.name"></label>
      <input type="text" name="name" placeholder="—" required>
    </div>
    <div class="field">
      <label data-i18n="contact.form.email"></label>
      <input type="email" name="email" placeholder="you@—" required>
    </div>
    <div class="field">
      <label data-i18n="contact.form.subject"></label>
      <div class="radio-group">
        <label><input type="radio" name="subject" value="free" checked> <span data-i18n="contact.form.opt1"></span></label>
        <label><input type="radio" name="subject" value="paid"> <span data-i18n="contact.form.opt2"></span></label>
        <label><input type="radio" name="subject" value="hi"> <span data-i18n="contact.form.opt3"></span></label>
      </div>
    </div>
    <div class="field">
      <label data-i18n="contact.form.message"></label>
      <textarea name="message" placeholder="—" rows="3" required></textarea>
    </div>
    <div class="submit-row">
      <button type="submit"><span data-i18n="contact.form.send"></span></button>
    </div>
    <div class="sent hide" id="sentMsg" data-i18n="contact.form.sent"></div>
  </form>
</section>

<div class="marquee invert">
  <div class="marquee-track">
    <span>REPLY WITHIN 1–3 DAYS</span><span class="dot"></span>
    <span>BARCELONA · REMOTE · WORLD</span><span class="dot"></span>
  </div>
</div>

<footer class="footer"></footer>

<script src="i18n.js"></script>
<script src="shell.js"></script>
<script>
// pre-select pack from URL
const pack = new URLSearchParams(location.search).get('pack');
if (pack) {
  setTimeout(() => {
    document.querySelector('input[name=subject][value=free]').checked = true;
    const ta = document.querySelector('textarea[name=message]');
    if (ta && !ta.value) ta.value = `I am interested in Pack № 0${pack}.\n\n`;
    document.querySelector('input[name=name]').focus();
  }, 100);
}

document.getElementById('contactForm').addEventListener('submit', (e) => {
  e.preventDefault();
  document.getElementById('sentMsg').classList.remove('hide');
  e.target.reset();
});
</script>
</body>
</html>
