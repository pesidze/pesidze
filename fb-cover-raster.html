<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pesidze — FB cover raster</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#f4f1ea; --paper:#0a0a0a; --muted:#8a857c;
  --display:"Archivo Black", Helvetica, Arial, sans-serif;
  --body:"Space Grotesk", Helvetica, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, monospace;
  --serif:"Instrument Serif", serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;-webkit-font-smoothing:antialiased;overflow:hidden}
body{width:1640px;height:624px}
.cover{
  width:1640px;height:624px;background:var(--paper);color:var(--ink);
  font-family:var(--body);
  display:grid;grid-template-columns:1.5fr 1fr;gap:80px;
  padding:80px 100px;position:relative;
}
.tag-row{position:absolute;left:100px;right:100px;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:18px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted)}
.tag-row.top{top:36px}.tag-row.bot{bottom:36px}
.tag-row .brand{color:var(--ink)}
.stamp{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--ink);padding:8px 16px}
.stamp .dot{width:8px;height:8px;border-radius:50%;background:var(--ink)}

.left{display:flex;flex-direction:column;justify-content:center;align-self:center}
.name{font-family:var(--display);font-size:270px;line-height:0.82;letter-spacing:-0.045em;text-transform:uppercase}
.name .top{display:block;color:transparent;-webkit-text-stroke:3px var(--ink)}
.name .bot{display:block}
.tag{font-family:var(--serif);font-style:italic;font-size:38px;line-height:1.2;margin-top:36px;max-width:22ch}

.right{display:flex;flex-direction:column;justify-content:center;align-self:center;border-left:1px solid var(--ink);padding-left:60px}
.kicker{font-family:var(--mono);font-size:18px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}
.services{list-style:none;display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.services li{display:grid;grid-template-columns:56px 1fr;gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--ink);
  font-family:var(--display);font-size:34px;line-height:1;letter-spacing:-0.02em;text-transform:uppercase;color:var(--ink)}
.services .n{font-family:var(--mono);font-size:14px;letter-spacing:0.18em;color:var(--muted)}
</style>
</head>
<body>
<div class="cover">
  <div class="tag-row top">
    <span class="brand">PESIDZE®</span>
    <span class="stamp"><span class="dot"></span>Independent · Germany</span>
  </div>
  <div class="left">
    <div class="name"><span class="top">NICOLE</span><span class="bot">PESIDZE</span></div>
    <p class="tag"><em>Independent</em> graphic &amp; web designer for small &amp; medium businesses in Germany.</p>
  </div>
  <div class="right">
    <div class="kicker">→ What I do</div>
    <ul class="services">
      <li><span class="n">01</span><span>Brand identity</span></li>
      <li><span class="n">02</span><span>Web design</span></li>
      <li><span class="n">03</span><span>Social media</span></li>
      <li><span class="n">04</span><span>Posters &amp; print</span></li>
      <li><span class="n">05</span><span>Menus &amp; venue kits</span></li>
    </ul>
  </div>
  <div class="tag-row bot">
    <span>3 spots open · May ’26</span>
    <span>pesidze.com →</span>
  </div>
</div>
</body>
</html>
