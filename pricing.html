<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing — Pesidze</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.pricing-head {
  padding: 120px 28px 60px;
  border-bottom: 1px solid var(--ink);
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 60px; align-items: end;
}
.pricing-head .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: block; }
.pricing-head h1 { font-family: var(--display); font-size: clamp(56px, 10vw, 168px); line-height: 0.85; letter-spacing: -0.04em; text-transform: uppercase; }
.pricing-head h1 .it { font-family: "Instrument Serif", serif; font-style: italic; text-transform: lowercase; font-weight: normal; letter-spacing: -0.02em; }
.pricing-head p { font-size: 16px; max-width: 42ch; }

.pack {
  border-bottom: 1px solid var(--ink);
  padding: 80px 28px;
  display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 60px;
  align-items: start;
}
.pack .id { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: block; }
.pack .nm {
  font-family: var(--display); font-size: clamp(48px, 8vw, 112px);
  line-height: 0.85; letter-spacing: -0.03em; text-transform: uppercase;
}
.pack .tg { font-family: "Instrument Serif", serif; font-style: italic; font-size: clamp(24px, 3vw, 40px); line-height: 1.1; margin-top: 16px; color: var(--muted); }
.pack .includes-lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; display: block; }
.pack ul { list-style: none; }
.pack li {
  border-top: 1px solid var(--ink);
  padding: 16px 0;
  display: grid; grid-template-columns: 32px 1fr; gap: 16px;
  font-size: 16px; line-height: 1.4;
}
.pack li:last-child { border-bottom: 1px solid var(--ink); }
.pack li .n { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--muted); padding-top: 4px; }
.pack .price-card {
  border: 1px solid var(--ink);
  padding: 24px;
  position: sticky; top: 100px;
}
.pack .price-card .price-lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.pack .price-card .price { font-family: var(--display); font-size: 40px; line-height: 1; margin: 12px 0 8px; text-transform: uppercase; letter-spacing: -0.02em; }
.pack .price-card .sub { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; display: block; }
.pack .price-card .btn { width: 100%; justify-content: center; }

.pack:nth-child(odd) { background: var(--paper); }
.pack:nth-child(even) { background: var(--ink); color: var(--paper); }
.pack:nth-child(even) .id, .pack:nth-child(even) .includes-lbl, .pack:nth-child(even) .tg, .pack:nth-child(even) li .n { color: rgba(244,241,234,0.6); }
.pack:nth-child(even) li { border-color: rgba(244,241,234,0.4); }
.pack:nth-child(even) li:last-child { border-color: rgba(244,241,234,0.4); }
.pack:nth-child(even) .price-card { border-color: var(--paper); }
.pack:nth-child(even) .price-card .price-lbl,
.pack:nth-child(even) .price-card .sub { color: rgba(244,241,234,0.6); }
.pack:nth-child(even) .price-card .btn { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.pack:nth-child(even) .price-card .btn:hover { background: transparent; color: var(--paper); }

.who {
  padding: 80px 28px;
  border-bottom: 1px solid var(--ink);
  display: grid; grid-template-columns: 1fr 2fr; gap: 60px;
}
.who h3 { font-family: var(--display); font-size: clamp(40px, 6vw, 80px); line-height: 0.9; letter-spacing: -0.03em; text-transform: uppercase; }
.who p { font-size: 18px; line-height: 1.5; max-width: 60ch; }

@media (max-width: 800px) {
  .pricing-head, .pack, .who { grid-template-columns: 1fr; gap: 32px; }
  .pack .price-card { position: static; }
}
</style>
</head>
<body data-page="pricing">

<nav class="nav"></nav>

<section class="pricing-head" data-screen-label="Pricing hero">
  <div>
    <span class="kicker" data-i18n="pricing.kicker"></span>

  </div>
  <p data-i18n="pricing.lead"></p>

<section class="pack" id="p1" data-screen-label="Pack 01">

  </div>
  <div>

      <li><span class="n">01</span><span data-i18n="pricing.p1.l1"></span></li>
      <li><span class="n">02</span><span data-i18n="pricing.p1.l2"></span></li>
      <li><span class="n">03</span><span data-i18n="pricing.p1.l3"></span></li>
      <li><span class="n">04</span><span data-i18n="pricing.p1.l4"></span></li>
      <li><span class="n">05</span><span data-i18n="pricing.p1.l5"></span></li>

  </div>
  <div class="price-card">
    <span class="price-lbl" data-i18n="pricing.priceLabel"></span>

    <p class="tg" data-i18n="pricing.p2.tag"></p>
  </div>
  <div>
    <span class="includes-lbl" data-i18n="pricing.includesLabel"></span>
    <ul>
      <li><span class="n">01</span><span data-i18n="pricing.p2.l1"></span></li>
      <li><span class="n">02</span><span data-i18n="pricing.p2.l2"></span></li>
      <li><span class="n">03</span><span data-i18n="pricing.p2.l3"></span></li>
      <li><span class="n">04</span><span data-i18n="pricing.p2.l4"></span></li>
      <li><span class="n">05</span><span data-i18n="pricing.p2.l5"></span></li>
    </ul>
  </div>
  <div class="price-card">
    <span class="price-lbl" data-i18n="pricing.priceLabel"></span>
    <div class="price">€0 / setup</div>
    <span class="sub" data-i18n="pricing.priceFree"></span>
    <a href="contact.html?pack=2" class="btn" data-cursor="apply"><span data-i18n="pricing.applyBtn"></span></a>
  </div>
</section>

<section class="pack" id="p3" data-screen-label="Pack 03">
  <div>
    <span class="id">Pack № 03</span>
    <span class="nm" data-i18n="pricing.p3.name"></span>
    <p class="tg" data-i18n="pricing.p3.tag"></p>
  </div>
  <div>
    <span class="includes-lbl" data-i18n="pricing.includesLabel"></span>
    <ul>
      <li><span class="n">01</span><span data-i18n="pricing.p3.l1"></span></li>
      <li><span class="n">02</span><span data-i18n="pricing.p3.l2"></span></li>
      <li><span class="n">03</span><span data-i18n="pricing.p3.l3"></span></li>
      <li><span class="n">04</span><span data-i18n="pricing.p3.l4"></span></li>
      <li><span class="n">05</span><span data-i18n="pricing.p3.l5"></span></li>
    </ul>
  </div>
  <div class="price-card">
    <span class="price-lbl" data-i18n="pricing.priceLabel"></span>
    <div class="price">€0 / mo</div>
    <span class="sub" data-i18n="pricing.priceFree"></span>
    <a href="contact.html?pack=3" class="btn" data-cursor="apply"><span data-i18n="pricing.applyBtn"></span></a>
  </div>
</section>

<section class="who">
  <h3 data-i18n="pricing.footnote.title"></h3>
  <p data-i18n="pricing.footnote.body"></p>
</section>

<div class="marquee">
  <div class="marquee-track">
    <span>SMALL BUSINESSES</span><span class="dot"></span>
    <span>NGOs · ALWAYS FREE</span><span class="dot"></span>
    <span>SOCIAL CAUSES · DISCOUNTED</span><span class="dot"></span>
  </div>
</div>

<section style="padding:120px 28px; text-align:center;">
  <p style="font-family:var(--display); font-size:clamp(40px,7vw,96px); line-height:0.9; letter-spacing:-0.03em; text-transform:uppercase; max-width:18ch; margin:0 auto;">
    Pick a pack, drop a line.
  </p>
  <a href="contact.html" class="btn invert" style="margin-top:32px;" data-cursor="contact">Apply now →</a>
</section>

<footer class="footer"></footer>

<script src="i18n.js"></script>
<script src="shell.js"></script>
</body>
</html>
