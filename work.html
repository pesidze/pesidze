<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — Pesidze</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="/assets/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.work-head { padding: 56px 28px 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: end; }
.work-head h1 { font-family: var(--display); font-size: clamp(60px, 12vw, 200px); line-height: 0.85; letter-spacing: -0.04em; text-transform: uppercase; }
.work-head p { font-size: 18px; max-width: 40ch; }

/* categories — own band, not part of the hero */
.cat-band { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); background: var(--ink); color: var(--paper); position: sticky; top: 0; z-index: 60; }
.cat-band .cat-label { padding: 12px 28px 0; font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--paper); }
.filters { display: flex; flex-wrap: wrap; gap: 0; padding: 0 20px 4px; }
.filters button { padding: 10px 8px 16px; margin: 0 8px; font-family: var(--display); font-size: clamp(20px, 2.6vw, 34px); text-transform: uppercase; letter-spacing: -0.02em; line-height: 1; color: var(--paper); background: none; border: 0; border-bottom: 4px solid transparent; transition: color .15s, border-color .15s; }
.filters button:hover { color: var(--paper); }
.filters button.on { color: var(--paper); border-bottom-color: var(--paper); }
.filters button .ct { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; vertical-align: super; margin-left: 4px; opacity: .6; }

.cases { display: flex; flex-direction: column; }
.case { border-bottom: 1px solid var(--ink); padding: 72px 28px; display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: 56px; align-items: start; }
.case .visual { position: relative; aspect-ratio: 4 / 3; border: 1px solid var(--ink); background: var(--paper-2); }
.case .visual.tall { aspect-ratio: 4 / 3; }
.case .shots { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; margin-top: 12px; }
.case .shots .mini { position: relative; aspect-ratio: 1; border: 1px solid var(--ink); background: var(--paper-2); }
.case .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.case h2 { font-family: var(--display); font-size: clamp(24px, 2.6vw, 38px); line-height: 1; letter-spacing: -0.025em; text-transform: uppercase; margin: 10px 0 14px; }
.case .did { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.case .did span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid var(--ink); padding: 5px 8px; }
.case .desc { font-size: 15px; line-height: 1.55; max-width: 48ch; margin-bottom: 24px; }
.ps { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0; border: 1px solid var(--ink); margin-bottom: 24px; }
.ps > div { padding: 16px 18px; }
.ps > div + div { border-left: 1px solid var(--ink); }
.ps h4 { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.ps p { font-size: 13px; line-height: 1.5; }
.case .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; border-top: 1px solid var(--ink); padding-top: 18px; }
.case .specs .lbl { color: var(--muted); display: block; margin-bottom: 4px; }
.case .more { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 3px; }

@media (max-width: 900px) { .case, .work-head { grid-template-columns: 1fr; } .ps { grid-template-columns: 1fr; } .ps > div + div { border-left: 0; border-top: 1px solid var(--ink); } }
/* responsive safety */
img,video{max-width:100%;height:auto}
[style*="width:594px"],[style*="width: 594px"],[style*="width:652px"],[style*="width: 652px"]{width:auto!important;max-width:100%!important;height:auto!important}
.vitals-more{height:auto!important}
@media (max-width:760px){.sec-head{grid-template-columns:1fr!important}.stats,.vitals,.tiers,.factors,.xp,.lead-grid{grid-template-columns:1fr!important}.cmp{font-size:14px}.cmp th,.cmp td{padding:12px 8px}}
@media (max-width:560px){.cta h2{white-space:normal!important}.person{grid-template-columns:72px minmax(0,1fr)!important}.person .ph{width:72px!important}}
.slot-img{width:100%;height:100%;object-fit:cover;display:block}.slot-empty{width:100%;height:100%;background:var(--paper-2,#eee)}
</style>
</head>
<body data-page="work">
<a class="skip" href="#main">Skip to content</a>

<nav class="nav"></nav>

<section id="main" class="work-head">
  <h1 data-i18n="work.title"></h1>
  <p data-i18n="work.lead"></p>
</section>

<div class="cat-band">
  <div class="cat-label">Browse by category</div>
  <div class="filters" id="filters">
    <button class="on" data-filter="all" data-i18n="work.filter.all"></button>
    <button data-filter="web" data-i18n="work.filter.web"></button>
    <button data-filter="editorial" data-i18n="work.filter.editorial"></button>
    <button data-filter="poster" data-i18n="work.filter.poster"></button>
    <button data-filter="menu" data-i18n="work.filter.menu"></button>
    <button data-filter="social" data-i18n="work.filter.social"></button>
  </div>
</div>

<section class="cases" id="cases"></section>

<div class="marquee invert">
  <div class="marquee-track">
    <span>NINE PROJECTS</span><span class="dot"></span>
    <span>2023 — 2026</span><span class="dot"></span>
    <span>BERLIN &amp; BEYOND</span><span class="dot"></span>
  </div>
</div>

<section style="padding:56px 28px; text-align:center; border-top:1px solid var(--ink);">
  <h2 style="font-family:var(--display); font-size:clamp(48px,8vw,120px); line-height:0.85; letter-spacing:-0.03em; text-transform:uppercase;">
    Want something like this?
  </h2>
  <a href="/contact" class="btn invert" style="margin-top:32px;" data-cursor="contact">Start a project →</a>
</section>

<footer class="footer"></footer>

<script src="/i18n.js"></script>
<script src="/shell.js"></script>
<script>
const cases = [
  { id:'01', cat:['web','menu'], title:'Café Bondia', client:'Bondia Coffee, Prenzlauer Berg', year:'2025', did:['Identity','Menu design','One-page site'],
    desc:'A third-wave coffee bar needed an identity that works equally on a chalkboard, a takeaway cup and a one-page website.',
    problem:'Three different people were making signage in three different tools. Nothing matched, and the menu had to be reprinted every fortnight.',
    solution:'One workhorse typeface, a paper-and-ink palette, and an editable menu template the team updates themselves in minutes.' },
  { id:'02', cat:['editorial'], title:'Casa Lluvia', client:'Casa Lluvia Collective', year:'2025', did:['Editorial system','Grid','Print production'],
    desc:'Bilingual print magazine for a literary collective. Twice-yearly, 96 pages, hand-bound.',
    problem:'Long-form essays in two languages ran to wildly different lengths and broke every layout the collective tried.',
    solution:'A two-column grid that compresses and expands per language, with a rhythm of full-bleed plates to reset the reader.' },
  { id:'03', cat:['web','social'], title:'Mar de Fons', client:'Mar de Fons NGO', year:'2024', did:['Donation flow','Web','Social system'],
    desc:'Donation landing and campaign system for an ocean-cleanup non-profit. Delivered pro-bono.',
    problem:'Donations dropped off at a four-step form that asked people to create an account before paying.',
    solution:'A one-screen, no-account checkout with a transparent breakdown of where each euro goes, plus a reusable campaign kit.' },
  { id:'04', cat:['poster','social'], title:'Studio Vermut', client:'Studio Vermut, Kreuzberg', year:'2024', did:['Wayfinding','Poster series','Social calendar'],
    desc:'Wayfinding and a weekly social calendar for a co-working space across two floors.',
    problem:'Members could not find rooms, and the team was designing event posters from scratch every week.',
    solution:'Oversized numerals per room and a monthly poster series driven by one template that swaps type and member photos.' },
  { id:'05', cat:['web'], title:'Pan &amp; Pluma', client:'Independent writer', year:'2024', did:['Web','Post templates'],
    desc:'Long-form blog and a weekly post system for an independent writer.',
    problem:'A heavy off-the-shelf theme buried the writing under widgets and loaded slowly on mobile.',
    solution:'Reading-first layout: serif body, generous measure, and chrome that disappears once you pass the first paragraph.' },
  { id:'06', cat:['menu','editorial'], title:'Casa Quimet', client:'Casa Quimet, Neukölln', year:'2024', did:['Menu system','Risograph print'],
    desc:'Seasonal menu system for a neighbourhood wine bar that changes dishes every fortnight.',
    problem:'Reprinting a full-colour menu twice a month cost more than the wine list earned.',
    solution:'Two-colour risograph menus on a fixed frame, with only the dish block reset each cycle.' },
  { id:'07', cat:['social'], title:'Tàndem Clínica', client:'Tàndem Mental Health', year:'2024', did:['Social system','Copy framework','Templates'],
    desc:'A weekly Instagram and TikTok system for a mental-health clinic speaking to teenagers.',
    problem:'Clinical language and stock imagery made serious advice read as an advert nobody trusted.',
    solution:'Soft palette, blunt one-line copy, and a template framework the in-house team runs without a designer.' },
  { id:'08', cat:['poster'], title:'Festival Soroll', client:'Festival Soroll', year:'2023', did:['Poster series','Programme'],
    desc:'Eight posters and a printed programme for a noise-music micro-festival.',
    problem:'A line-up of unknown acts had to sell tickets on atmosphere alone, with no photography budget.',
    solution:'One typographic system that gets physically louder as the night gets later — density as the only image.' },
  { id:'09', cat:['web','editorial'], title:'Mosaic CMS', client:'Mosaic OS — SaaS', year:'2023', did:['Design system','Docs site','UX'],
    desc:'Documentation site and content design system for a SaaS company (my day job).',
    problem:'Every product team wrote docs in its own voice and layout, so nothing felt like one product.',
    solution:'A componentised, accessible and theme-able system with writing rules baked into the components.' },
];

const root = document.getElementById('cases');
root.innerHTML = cases.map((c, i) => {
  const text = `
    <div>
      <div class="meta">№ ${c.id} · ${c.cat.join(' · ').toUpperCase()} · ${c.year}</div>
      <h2>${c.title}</h2>
      <div class="did">${c.did.map(d => `<span>${d}</span>`).join('')}</div>
      <p class="desc">${c.desc}</p>
      <div class="ps">
        <div><h4>Problem</h4><p>${c.problem}</p></div>
        <div><h4>Solution</h4><p>${c.solution}</p></div>
      </div>
      <div class="specs">
        <div><span class="lbl">Client</span>${c.client}</div>
        <div><span class="lbl">Year</span>${c.year}</div>
      </div>
      <a class="more" href="#${c.id}" data-cursor="soon">Full case study — soon <span>→</span></a>
    </div>`;
  const visual = `
    <div>
      <div class="visual"><div class="slot-empty"></div></div>
      <div class="shots">
        <div class="mini"><div class="slot-empty"></div></div>
        <div class="mini"><div class="slot-empty"></div></div>
      </div>
    </div>`;
  return `<article class="case" data-cat="${c.cat.join(' ')}" id="${c.id}">
    ${i % 2 ? visual + text : text + visual}
  </article>`;
}).join('');

// category counts
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('#filters button').forEach(b => {
    const f = b.dataset.filter;
    const n = f === 'all' ? cases.length : cases.filter(c => c.cat.includes(f)).length;
    b.insertAdjacentHTML('beforeend', `<span class="ct">${n}</span>`);
  });
});

document.getElementById('filters').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
  const f = b.dataset.filter;
  document.querySelectorAll('.case').forEach(c => {
    c.style.display = (f === 'all' || c.dataset.cat.includes(f)) ? '' : 'none';
  });
});

window.PESIDZE_bindCursor && window.PESIDZE_bindCursor();
window.PESIDZE_setupReveal && window.PESIDZE_setupReveal();
</script>
<script src="/assets/nav.js" defer></script>
<script src="/assets/consent.js" defer></script>
</body>
</html>
